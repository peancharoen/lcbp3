# File: specs/04-Infrastructure-OPS/04-00-docker-compose/np-dms-lcbp3/05-ci/config.yaml
# act_runner configuration — lcbp3-runner on New Server (192.168.10.11)
# Change Log:
# - 2026-09-12: Initial creation — migrate from ASUSTOR (capacity=2, same config)

runner:
  # Execute 2 tasks concurrently (same as ASUSTOR — มี headroom พอสำหรับ Ryzen 5 5600)
  capacity: 2

  # Timeout สำหรับ job ใหม่ที่รอเข้ามา
  fetch_timeout: 5s
  fetch_interval: 2s

log:
  level: info

cache:
  enabled: true

container:
  # Bridge network — แยก CI containers จาก lcbp3 production network
  network: bridge
