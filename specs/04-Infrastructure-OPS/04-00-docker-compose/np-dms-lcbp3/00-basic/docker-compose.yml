# File: specs/04-Infrastructure-OPS/04-00-docker-compose/np-dms-lcbp3/00-basic/docker-compose.yml
# DMS Container v1.9.x — Layer 0: Basic (Docker Management)
# Host: np-dms-lcbp3 (192.168.10.11)
# Change Log:
# - 2026-07-20: ย้าย Portainer จาก 01-infrastructure มาที่ 00-basic
#   เพื่อแยก Docker management UI ออกจาก infrastructure services
# ============================================================
# 🔒 SECURITY (ADR-016, Tier-1):
#   - Portainer: expose 192.168.10.11:9443 → NPM proxy (portainer.np-dms.work)
# ============================================================

x-restart: &restart_policy
  restart: unless-stopped

x-logging: &default_logging
  logging:
    driver: 'json-file'
    options:
      max-size: '10m'
      max-file: '5'

name: lcbp3-basic

networks:
  lcbp3:
    external: true

services:
  # ----------------------------------------------------------------
  # 1. Portainer — Docker Management UI
  # Expose: 192.168.10.11:9443 → NPM proxy (portainer.np-dms.work)
  # ต้อง mount docker.sock เพื่อจัดการ containers ทุกตัว
  # ----------------------------------------------------------------
  portainer:
    <<: [*restart_policy, *default_logging]
    image: portainer/portainer-ce:latest
    container_name: portainer
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    environment:
      TZ: 'Asia/Bangkok'
    ports:
      - '192.168.10.11:9443:9443'
      - '192.168.10.11:8000:8000'
    networks:
      - lcbp3
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
      - 'portainer_data:/data'
    healthcheck:
      disable: true

volumes:
  portainer_data:
    driver: local
