name: CI / CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  # ============================================================
  # JOB 1 : CI & Quality Gate
  # ============================================================
  build:
    runs-on: lcbp3-ci
    timeout-minutes: 15
    if: "!contains(github.event.head_commit.message, '[skip CI]')"
    steps:
      - name: Checkout (HTTPS)
        uses: actions/checkout@v4

      # ── [1] pnpm 12 = native binary (Rust) — ใช้ pnpm/setup ไม่ใช่ action-setup ──
      - name: ⚙️ Install pnpm + Node
        uses: pnpm/setup@v1
        with:
          version: 12.4.0
          runtime: node@24
          # version อ่านจาก packageManager field ใน package.json อัตโนมัติ
          # runtime อ่านจาก devEngines.runtime หรือระบุ explicit (node@24)

      # ── [2] ชี้ store ไปที่ volume ที่ mount ไว้ ─────────────
      - name: 🔧 Set pnpm store path
        run: pnpm config set store-dir /root/.local/share/pnpm

      - name: 📦 Install deps
        run: pnpm install --frozen-lockfile

      - name: 🧹 Clean stale ESLint cache
        run: rm -rf backend/.eslintcache backend/node_modules/.cache

      - name: 🧹 Lint
        run: pnpm --filter backend lint:ci
        working-directory: .
        env:
          NODE_OPTIONS: "--max-old-space-size=3072"

      - name: 🔍 Security & quality checks
        run: |
          # UUID misuse check (ADR-019)
          if grep -r --include="*.ts" --include="*.tsx" --exclude-dir={node_modules,.next,.agents,.git,scripts,test,__tests__} "parseInt(.*uuid" .; then
            echo "❌ UUID misuse detected"
            exit 1
          fi
          # console.log check (Clean Code)
          if grep -r --include="*.ts" --include="*.tsx" --exclude-dir={node_modules,.next,.agents,.git,scripts,test,__tests__} "console.log" .; then
            echo "❌ console.log detected"
            exit 1
          fi

      - name: 🔍 Patch integrity check
        # ตรวจสอบว่าทุก patchedDependencies มี package อยู่ใน workspace อย่างน้อย 1 ตัว
        # ป้องกัน orphan patch ที่จะทำให้ pnpm --filter deploy fail (allowUnusedPatches ปิด safety net)
        run: ./scripts/check-patches.sh

      # ── [3] แยก step — เห็น failure ได้ชัดขึ้น ──────────────
      - name: 🧪 Test backend
        run: pnpm test
        working-directory: backend
        env:
          CI: "true"
          NODE_OPTIONS: "--max-old-space-size=3072"

      - name: 🧪 Test frontend
        run: pnpm test run
        working-directory: frontend
        env:
          CI: "true"

  # ============================================================
  # JOB 2 : Deploy — New Server (np-dms-lcbp3 / 192.168.10.11)
  # Architecture: ADR-041 Server Consolidation
  # 4-layer docker-compose:
  #   Layer 1: Infrastructure (mariadb, redis, es, qdrant, pma)
  #   Layer 2: Platform (gitea, n8n, n8n-db, docker-socket-proxy)
  #   Layer 3: Application (clamav, backend, frontend) ← deploy target
  #   Layer 4: AI (ocr-sidecar, ollama-metrics — Ollama = native systemd)
  # Source repo: /opt/np-dms-lcbp3/ (git clone)
  # Runtime:     /opt/np-dms/{01-infrastructure,02-platform,03-application,04-ai}/
  # Env:         /opt/np-dms/.env (master — shared across all layers)
  # ============================================================
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: lcbp3-ci
    steps:
      - name: " Checkout"
        uses: actions/checkout@v4

      - name: "🚀 Deploy to New Server (np-dms-lcbp3)"
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=30 \
              -o BatchMode=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -i ~/.ssh/id_rsa \
              -p ${{ secrets.PORT }} ${{ secrets.USERNAME }}@${{ secrets.HOST }} bash << 'REMOTE_EOF'
            set -e
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"

            cd /opt/np-dms-lcbp3
            [ -d .git ] || { echo "✗ Git repo not found"; exit 1; }

            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/deploy.sh scripts/rollback.sh 2>/dev/null || true
            mkdir -p /opt/np-dms/logs

            ./scripts/deploy.sh
          REMOTE_EOF
        timeout-minutes: 20
