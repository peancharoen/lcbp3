packages:
  - backend
  - frontend

# pnpm v12: จำเป็นสำหรับ pnpm deploy แบบไม่ใช้ --legacy
# (deploy สร้าง dedicated lockfile จาก shared lockfile — ล็อคเวอร์ชันตรง ไม่ re-resolve)
injectWorkspacePackages: true

# ── pnpm v11 migration: .npmrc settings → pnpm-workspace.yaml ──────────────
# ย้ายจาก .npmrc (root) — pnpm v11 อ่าน auth/registry อย่างเดียวจาก .npmrc
shamefullyHoist: true
publicHoistPattern:
  - "*typeorm*"
  - "*ts-node*"
preferWorkspacePackages: true

# ── pnpm v11 migration: build-dependency settings → allowBuilds ───────────
# แปลงจาก ignoredBuiltDependencies + onlyBuiltDependencies → allowBuilds map
allowBuilds:
  "@compodoc/compodoc": false
  esbuild: false
  unrs-resolver: false
  "@nestjs/core": true
  "@scarf/scarf": true
  bcrypt: true
  msgpackr-extract: true
  sharp: true

# ── pnpm v11 migration: supply-chain protection ───────────────────────────
# pnpm v11 เปิด minimumReleaseAge=1440 (1 วัน) default — package ที่ publish
# ไม่ถึง 24h จะไม่ถูก resolve ปิดเพื่อรักษาพฤติกรรมเดิม (CI ใช้ --frozen-lockfile)
minimumReleaseAge: 0

# ── pnpm v11 migration: settings จาก backend/.npmrc → root level ──────────
# pnpm v11 packageConfigs รองรับเฉพาะ fields จำกัด (saveExact, savePrefix, modulesDir)
# hoisting/nodeLinker/peer settings ต้องตั้งที่ root level
# nodeLinker: isolated — ใช้สำหรับ backend (frontend ใช้ default hoisted ได้)
nodeLinker: isolated
strictPeerDependencies: false
autoInstallPeers: true

overrides:
  # pin @nestjs/swagger ให้ตรงกับ patch (lockfile ล็อค 11.2.3 แต่ --legacy deploy re-resolve ได้ 11.4.7)
  "@nestjs/swagger": "11.2.3"
  fast-xml-parser: ">=5.5.7 <6.0.0"
  "@nestjs/terminus": "^11.0.0"
  reflect-metadata: "^0.2.2"
  "jws@<3.2.3": ">=3.2.3 <4.0.0"
  "lodash@>=4.0.0 <=4.17.23": ">=4.18.0 <5.0.0"
  # undici: pin 7.29.0 (bounded) — ห้าม resolve ไป 8.x
  # target แบบ ">=6.24.0" (ปลายเปิด) เดิมทำให้ resolve ไป 8.10.0 แล้ว Qdrant ใช้งานไม่ได้ทั้งหมด:
  # @qdrant/js-client-rest สร้าง undici.Agent ส่งเป็น dispatcher เข้า global fetch ของ Node 24
  # (ใช้ undici 7 ภายใน) — Agent ของ undici 8 ตัด handler interface เดิมออก จึง throw
  # "invalid onRequestStart method" → AiQdrantService collection init + RAG search fail
  # jsdom 29 ก็ต้องการ undici 7.x internals (wrap-handler.js) เช่นกัน
  # ตรวจแล้ว @elastic/transport ทำงานได้ทั้ง 7.29.0 และ 8.x → pin 7.29.0 ปลอดภัยทั้งทรี
  undici: "7.29.0"
  "diff@>=4.0.0 <4.0.4": ">=4.0.4 <5.0.0"
  "@isaacs/brace-expansion@<=5.0.0": ">=5.0.1 <6.0.0"
  "webpack@>=5.49.0 <=5.104.0": ">=5.104.1 <6.0.0"
  "webpack@>=5.49.0 <5.104.0": ">=5.104.0 <6.0.0"
  "qs@>=6.7.0 <=6.14.1": ">=6.14.2 <7.0.0"
  "qs@<6.14.1": ">=6.14.1 <7.0.0"
  "qs@>=6.11.1 <=6.15.1": ">=6.15.2 <7.0.0"
  # axios: fix HIGH proxy bypass + MODERATE DoS/pollution (CVE-2026 series)
  "axios@>=1.0.0 <1.19.0": ">=1.19.0 <2.0.0"
  "minimatch@<3.1.3": ">=3.1.3 <4.0.0"
  "minimatch@>=9.0.0 <9.0.6": ">=9.0.6 <10.0.0"
  "minimatch@>=10.0.0 <10.2.1": ">=10.2.1 <11.0.0"
  "minimatch@>=9.0.0 <9.0.7": ">=9.0.7 <10.0.0"
  "minimatch@>=10.0.0 <10.2.3": ">=10.2.3 <11.0.0"
  "minimatch@<3.1.4": ">=3.1.4 <4.0.0"
  "multer@<2.3.0": ">=2.3.0 <3.0.0"
  "serialize-javascript@<=7.0.2": ">=7.0.3 <8.0.0"
  # ajv: fix fast-uri HIGH host confusion (3 advisories)
  "ajv@^6.0.0": "6.14.0"
  "ajv@^8.0.0": "8.20.0"
  "eslint>ajv": "6.14.0"
  "@eslint/eslintrc>ajv": "6.14.0"
  "fast-uri@<=3.1.1": ">=3.1.2 <4.0.0"
  # dompurify: fix MODERATE ALLOWED_ATTR pollution + IN_PLACE hook XSS
  "dompurify@>=3.1.3 <=3.3.1": ">=3.3.2 <4.0.0"
  "dompurify@<3.4.14": ">=3.4.14 <4.0.0"
  "file-type@>=13.0.0 <21.3.1": ">=21.3.1 <22.0.0"
  "file-type@>=20.0.0 <=21.3.1": ">=21.3.2 <22.0.0"
  "flatted@<3.4.0": ">=3.4.0 <4.0.0"
  # socket.io: fix HIGH Engine.IO polling exhaustion + socket.io-parser memory exhaustion
  "socket.io-parser@>=4.0.0 <4.2.7": ">=4.2.7 <5.0.0"
  "engine.io@>=4.0.0 <6.6.7": ">=6.6.7 <7.0.0"
  "handlebars@>=4.0.0 <=4.7.8": ">=4.7.9 <5.0.0"
  # vite: fix transitive postcss/nanoid
  "vite@>=7.0.0 <7.3.6": ">=7.3.6 <8.0.0"
  # next: fix CRITICAL RCE on Windows + Image Optimization (GHSA-p293-qw3h-jr36)
  "next@>=16.0.0 <16.3.3": ">=16.3.3 <17.0.0"
  # next-auth: fix CRITICAL fail-open + email normalizer + HIGH getToken exception
  "next-auth@>=5.0.0-beta.1 <5.0.0-beta.32": ">=5.0.0-beta.32"
  "@auth/core@<0.41.0": ">=0.41.0 <0.42.0"
  "fast-xml-builder@<=1.1.6": ">=1.1.7 <2.0.0"
  "@babel/plugin-transform-modules-systemjs@>=7.12.0 <=7.29.3": ">=7.29.4 <8.0.0"
  # postcss: fix HIGH arbitrary file read + path traversal (2 advisories)
  "postcss@<8.5.26": ">=8.5.26 <9.0.0"
  # nanoid: fix HIGH infinite loop on negative/zero size
  "nanoid@<5.0.0": ">=5.0.0 <6.0.0"
  # typeorm: fix MODERATE SQL injection in orderBy + migration:generate code injection
  "typeorm@>=0.3.0 <0.3.31": ">=0.3.31 <0.4.0"
  # sharp: fix HIGH libvips CVEs (GHSA-g89c-p67h-r497, GHSA-2jg2-4ch7-h545)
  "sharp@<0.35.4": ">=0.35.4 <0.36.0"
  # body-parser: fix LOW DoS on invalid limit
  "body-parser@<2.3.0": ">=2.3.0 <3.0.0"
  # morgan: fix MODERATE log forging via unescaped Unicode line separators
  "morgan@<1.12.0": ">=1.12.0 <2.0.0"
  # websocket-driver: fix CRITICAL message corruption + MODERATE compression bypass
  "websocket-driver@<0.7.5": ">=0.7.5 <0.8.0"
  # js-yaml: fix HIGH quadratic CPU consumption
  "js-yaml@<4.3.1": ">=4.3.1 <5.0.0"
  # brace-expansion: fix HIGH DoS
  "brace-expansion@>=1.0.0 <1.1.13": ">=1.1.13 <2.0.0"
  "brace-expansion@>=5.0.0 <5.0.9": ">=5.0.9 <6.0.0"
  "ws@>=8.0.0 <8.21.0": ">=8.21.0 <9.0.0"
  "yaml@<2.8.3": ">=2.8.3 <3.0.0"
  "nodemailer@<9.1.1": ">=9.1.1 <10.0.0"
  "follow-redirects@<=1.15.11": ">=1.16.0 <2.0.0"
  "uuid@>=13.0.0 <13.0.1": ">=13.0.1 <=13.0.2"
  "uuid@>=11.0.0 <11.1.1": ">=11.1.1 <12.0.0"
  "uuid@<11.1.1": ">=11.1.1 <12.0.0"
  "picomatch@<2.3.2": ">=2.3.2 <3.0.0"
  "picomatch@>=4.0.0 <4.0.4": ">=4.0.4 <5.0.0"
  "path-to-regexp@>=8.0.0 <8.4.0": ">=8.4.0 <9.0.0"
  "@opentelemetry/core@<2.8.0": ">=2.8.0 <3.0.0"
  "esbuild@<0.28.1": ">=0.28.1 <0.29.0"
  "@babel/core@<=7.29.0": ">=7.29.6 <=8.0.1"
  "form-data@<4.0.6": ">=4.0.6 <5.0.0"
  # zod: pin 4.3.6 — แก้ backend/frontend version mismatch (4.1.13 vs 4.3.6)
  # ที่ทำให้ tsc --noEmit fail ด้วย incompatible $ZodCheck types
  zod: "4.3.6"
  # mysql2: fix HIGH auth-plugin downgrade + MODERATE unbounded zlib inflate
  "mysql2@<3.23.1": ">=3.23.1 <4.0.0"
  # browserslist: fix HIGH unbounded memory growth + HIGH crash/prototype write
  "browserslist@<4.28.7": ">=4.28.7 <5.0.0"
  # qs: fix MODERATE array-limit bypass + MODERATE DoS via isBuffer
  "qs@<6.16.0": ">=6.16.0 <7.0.0"
  # @humanfs/node: fix MODERATE recursive copy follows symlinks
  "@humanfs/node@<0.16.8": ">=0.16.8 <1.0.0"
  # postcss-selector-parser: fix LOW DoS via uncontrolled AST recursion
  "postcss-selector-parser@>=6.1.0 <6.1.3": ">=6.1.3 <7.0.0"
  # joi: fix LOW prototype pollution (GHSA-6w3j-5fw6-r9vr, GHSA-gg4h-3hg2-grpc)
  "joi@>=18.0.0 <18.2.5": ">=18.2.5 <19.0.0"
  # vitest: fix MODERATE path traversal via @vitest/mocker (GHSA-82fw-gwwq-j7x9)
  "vitest@>=2.1.0 <4.1.11": ">=4.1.11 <5.0.0"

# allowUnusedPatches: true — อนุญาตให้ patch ไม่ถูกใช้ในบาง workspace package
# ใช้เมื่อ patchedDependencies อยู่ที่ workspace root แต่ patch เฉพาะ backend
# (เช่น @nestjs/swagger) ตอน pnpm --filter lcbp3-frontend deploy จะไม่ fail
# Added in pnpm v10.7.0
allowUnusedPatches: true

patchedDependencies:
  "@nestjs/swagger": patches/@nestjs__swagger.patch
