  - esbuild
  - unrs-resolver

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@scarf/scarf"
  - bcrypt
  - msgpackr-extract
  - sharp

overrides:
  fast-xml-parser: ">=5.5.7"
